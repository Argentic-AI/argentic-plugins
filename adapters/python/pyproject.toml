[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "argentic-labs"
version = "0.1.7"
description = "Argentic client for Python. The engine runs your agent for hours, rebuilding each prompt from a journal (state blocks plus a recent tail of about 40K tokens) instead of an ever-growing transcript. Adapters for LangChain / LangGraph, the OpenAI Agents SDK and Pydantic AI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Argentic", email = "hi@getargentic.com" }]
keywords = ["agents", "ai-agents", "long-running", "context", "journal", "resume", "langchain", "langgraph", "openai-agents", "pydantic-ai", "argentic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=1.0"]
openai-agents = ["openai-agents>=0.24"]
pydantic-ai = ["pydantic-ai-slim>=1.107"]

[project.scripts]
argentic-labs = "argentic_labs.cli:main"

[project.urls]
Homepage = "https://getargentic.com"
Documentation = "https://getargentic.com/docs/client/"
Repository = "https://github.com/Argentic-Labs-AI/argentic-plugins"
Issues = "https://github.com/Argentic-Labs-AI/argentic-plugins/issues"
Changelog = "https://getargentic.com/changelog/"

[tool.hatch.build.targets.wheel]
packages = ["argentic_labs"]

[tool.hatch.build.targets.sdist]
include = ["argentic_labs", "README.md", "LICENSE", "pyproject.toml"]
